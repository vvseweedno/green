[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carbon-mrv"
version = "0.1.0"
description = "Satellite MRV for carbon stock change, evidence fusion and verification"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CosmoHackathon team"}]
dependencies = [
  "numpy>=2.0,<3",
  "affine>=2.4,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.4,<2",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "pystac-client>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
carbon-mrv = "carbon_mrv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_mrv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
