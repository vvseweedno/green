services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    environment:
      CARBON_MRV_DATASET: /app/data/raw
      CARBON_MRV_RUNS: /app/runs
    command: sh -c "pip install -e . && uvicorn carbon_mrv.api.app:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes: [".:/app"]
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
